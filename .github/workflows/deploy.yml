name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2

      # A custom domain (public/CNAME) serves from the root whatever the repo
      # is called. Without this the site would build for /<repo-name>/ and
      # every asset would 404 on www.different-strokes.in.
      - name: Compute base path
        id: base
        run: |
          REPO="${GITHUB_REPOSITORY#*/}"
          if [[ -f public/CNAME || "$REPO" == *.github.io ]]; then
            echo "path=/" >> "$GITHUB_OUTPUT"
          else
            echo "path=/$REPO/" >> "$GITHUB_OUTPUT"
          fi

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build static site
        run: bun run build
        env:
          VITE_BASE_PATH: ${{ steps.base.outputs.path }}
          STATIC_BUILD: "true"

      # SPA fallback: unknown deep links load the app instead of GitHub's 404.
      - name: Add 404 fallback
        run: cp dist/client/index.html dist/client/404.html

      # Pages drops the custom domain unless CNAME is in the published output.
      - name: Verify CNAME survived the build
        run: test -f dist/client/CNAME && cat dist/client/CNAME

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
